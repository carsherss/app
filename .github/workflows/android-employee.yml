name: Employee Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/employee/**"
      - ".github/workflows/android-employee.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build employee debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/employee
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build debug APK
        working-directory: apps/employee/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: carshers-employee-debug-apk
          path: apps/employee/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
